[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caveman-code"
version = "0.1.0"
description = "Cave Man Code (CMC): the super-duper-easy programming language even a 4 year old can learn in 10-30 minutes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cave Man Code contributors" }]
keywords = ["programming-language", "education", "kids", "beginner", "interpreter", "caveman"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
cmc = "cmc.cli:main"
ogabooga = "ogabooga.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["cmc", "ogabooga"]